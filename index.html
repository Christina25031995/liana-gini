<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#541F2B">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<script>
(function(){
  try{
    if (location.search.indexOf('nored') !== -1) return;
    var w = Math.min(window.innerWidth || 9999, screen.width || 9999);
    var touch = matchMedia('(pointer:coarse)').matches;
    if ((w < 1100) || touch) location.replace('mobile.html' + location.hash);
  }catch(e){}
})();
</script>
<script src="assets/js/dc-runtime.js"></script>
</head>
<body>
<x-dc>

    <text x="600" y="430" font-family="Archivo, sans-serif" font-size="150" font-weight="700" fill="#F2EFE8" text-anchor="middle" letter-spacing="8">LG</text>
  </svg>
</template>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html body { background: #F2EFE8 !important; }
</style>
</helmet>
<div style="background:#F2EFE8;box-sizing:border-box;">
